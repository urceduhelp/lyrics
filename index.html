<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ගීත පද එකතුව — සෙවීම</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600&family=Noto+Serif+Sinhala:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b2333;--mu:#667085;--ac:#24386b;--ac2:#e8ecf6;--bd:#dde1ea;--hl:#fff2b3;--onac:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1a1f2a;--tx:#e9ecf3;--mu:#97a0b3;--ac:#8fa8e8;--ac2:#232b40;--bd:#2c3446;--hl:#5a4b12;--onac:#12151c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Sinhala","Iskoola Pota",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 40px}
header{padding:36px 0 18px;border-bottom:2px solid var(--ac);margin-bottom:14px}
h1{font:700 28px/1.3 "Noto Serif Sinhala",serif;margin:0;color:var(--ac)}
header p{margin:4px 0 0;color:var(--mu);font-size:14px}
header p b{color:var(--tx)}
.nav{font-size:13px;margin:0 0 10px}.nav a{color:var(--ac)}
.search{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
input,select{padding:11px 14px;font:inherit;border:1.5px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
#q{width:100%;font-size:16px}
select{font-size:14px;padding:8px 10px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#info{font-size:13px;color:var(--mu);margin:10px 0}
.item{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:6px;padding:14px 16px;margin-bottom:10px}
.item h2{font:700 18px/1.4 "Noto Serif Sinhala",serif;margin:0}
.au{margin:2px 0 0;font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-size:13px;color:var(--mu)}
.meta b{color:var(--tx);font-weight:600}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{background:var(--ac2);color:var(--ac);border-radius:4px;padding:1px 9px;font-size:12.5px}
.snip{margin:8px 0 0;padding:6px 10px;background:var(--ac2);border-radius:4px;font-size:13.5px}
details{margin-top:10px}
summary{cursor:pointer;color:var(--ac);font-size:14px;font-weight:600}
.ly{white-space:pre-wrap;font:inherit;font-size:15.5px;line-height:1.9;margin:10px 0 0;padding:12px 14px;border:1px solid var(--bd);border-radius:6px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid var(--bd)}
.b{padding:5px 12px;border:1px solid var(--bd);border-radius:6px;background:transparent;color:var(--tx);font:inherit;font-size:13px;cursor:pointer}
.b.p{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.b:disabled{opacity:.4;cursor:default}
a.lnk{color:var(--ac);word-break:break-all}
mark{background:var(--hl);color:inherit;border-radius:2px;padding:0 1px}
.pager{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:18px;font-size:14px}
.empty{text-align:center;color:var(--mu);padding:40px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;z-index:99}
.hide{display:none!important}
</style>
</head>
<body>
<div id="toast" class="hide"></div>
<div class="wrap">
<header><h1>🎵 ගීත පද එකතුව</h1><p id="stat"></p></header>
<div class="nav"><a href="index.html">← පුස්තකාල සෙවුම් පිටුව</a></div>

<div class="search">
  <input id="q" type="search" autocomplete="off" placeholder="ගීතයේ නම, ගායකයා, පද රචකයා, සංගීතය, චිත්‍රපටය හෝ පද වලින් සොයන්න..." aria-label="සොයන්න">
  <div class="row">
    <select id="sc" aria-label="සොයන ක්ෂේත්‍රය">
      <option value="all">සියලු ක්ෂේත්‍ර</option><option value="title">ගීතයේ නම</option><option value="artist">ගායකයා</option>
      <option value="lyricist">පද රචකයා</option><option value="composer">සංගීත අධ්‍යක්ෂ</option><option value="film">චිත්‍රපටය / ඇල්බමය</option><option value="lyrics">ගීත පද</option>
    </select>
    <select id="lg" aria-label="භාෂාව"><option value="">සියලු භාෂා</option></select>
  </div>
</div>

<div id="info"></div>
<div id="list"></div>
<div class="pager"><button class="b" id="prev">← පෙර</button><span id="pg"></span><button class="b" id="next">ඊළඟ →</button></div>
</div>

<script>
const sb = supabase.createClient("https://jcijglwpkfluyzrltimk.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjaWpnbHdwa2ZsdXl6cmx0aW1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4MzU3OTUsImV4cCI6MjA4MjQxMTc5NX0.dvT8OiyVEiYn_DhkMakmSq1Vvr4REDr0kYPnyqCtWHs");
const $ = id => document.getElementById(id);
const SIZE = 15;
const SCOPE = {all:["title","artist","lyricist","composer","album","film","genre","language","lyrics"], title:["title"], artist:["artist"], lyricist:["lyricist"],
  composer:["composer"], film:["film","album"], lyrics:["lyrics"]};
let page = 0, seq = 0, timer; const cache = {};

const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const terms = () => $("q").value.replace(/[,()%*_\\"']/g, " ").split(/\s+/).filter(Boolean);
const rx = t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function hl(s){
  let h = esc(s);
  terms().forEach(t => { h = h.replace(new RegExp("(" + rx(esc(t)) + ")(?![^<]*>)", "gi"), "<mark>$1</mark>"); });
  return h;
}
function linkOf(u){
  u = String(u ?? "").trim();
  const h = /^https?:\/\//i.test(u) ? u : /^www\./i.test(u) ? "https://" + u : "";
  return h ? `<a class="lnk" href="${esc(h)}" target="_blank" rel="noopener noreferrer">${esc(u.replace(/^https?:\/\//i, "").replace(/\/$/, ""))}</a>` : "";
}
function toast(t){ const e = $("toast"); e.textContent = t; e.classList.remove("hide"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.add("hide"), 2000); }
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); }
  toast("Copy කළා ✔");
}
function copySong(id){
  const b = cache[id];
  const head = [b.title, b.artist && "ගායනය: " + b.artist, b.lyricist && "පද රචනය: " + b.lyricist, b.composer && "සංගීතය: " + b.composer,
    b.film && "චිත්‍රපටය: " + b.film, b.album && "ඇල්බමය: " + b.album, b.year && "වර්ෂය: " + b.year, b.source_url && "මූලාශ්‍රය: " + b.source_url].filter(Boolean).join("\n");
  copyText(head + (b.lyrics ? "\n\n" + b.lyrics : ""));
}
/* ගැළපෙන පද පේළි (සෙවුම් වචන පද තුළ ඇත්නම්) */
function snippet(b){
  const ts = terms().map(t => t.toLowerCase()); if(!ts.length || !b.lyrics) return "";
  const lines = b.lyrics.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  const hit = lines.filter(l => ts.some(t => l.toLowerCase().includes(t))).slice(0, 2);
  return hit.length ? `<div class="snip">${hit.map(hl).join("<br>")}</div>` : "";
}
function card(b){
  const subs = [b.language, b.genre].filter(Boolean);
  const meta = [b.lyricist && `පද රචනය: <b>${hl(b.lyricist)}</b>`, b.composer && `සංගීතය: <b>${hl(b.composer)}</b>`,
    b.film && `චිත්‍රපටය: <b>${hl(b.film)}</b>`, b.album && `ඇල්බමය: <b>${hl(b.album)}</b>`, b.year && `වර්ෂය: <b>${esc(b.year)}</b>`]
    .filter(Boolean).map(x => `<span>${x}</span>`).join("");
  return `<article class="item">
    <h2>${hl(b.title)}</h2>
    ${b.artist ? `<p class="au">${hl(b.artist)}</p>` : ""}
    ${meta ? `<div class="meta">${meta}</div>` : ""}
    ${subs.length ? `<div class="tags">${subs.map(s => `<span class="tag">${hl(s)}</span>`).join("")}</div>` : ""}
    ${snippet(b)}
    ${b.lyrics ? `<details><summary>ගීත පද බලන්න</summary><pre class="ly">${hl(b.lyrics)}</pre></details>` : ""}
    <div class="foot">${b.source_url ? `<span style="margin-right:auto;font-size:13px">🔗 ${linkOf(b.source_url) || esc(b.source_url)}</span>` : ""}<button class="b" onclick="copySong(${b.id})">📋 Copy</button></div>
  </article>`;
}
const filt = qb => {
  const cols = SCOPE[$("sc").value] || SCOPE.all;
  terms().forEach(t => { qb = qb.or(cols.map(c => `${c}.ilike.%${t}%`).join(",")); });
  if($("lg").value) qb = qb.eq("language", $("lg").value);
  return qb;
};
async function load(scroll){
  const my = ++seq;
  const {data, count, error} = await filt(sb.from("songs").select("*", {count:"exact"}).eq("is_hidden", false))
    .order("title").order("id").range(page*SIZE, page*SIZE + SIZE - 1);
  if(my !== seq) return;
  if(error){ $("info").textContent = "දෝෂයක්: " + error.message; return; }
  data.forEach(b => cache[b.id] = b);
  const pages = Math.max(1, Math.ceil((count || 0) / SIZE));
  $("info").innerHTML = (terms().length || $("lg").value) ? `ප්‍රතිඵල <b>${count ?? 0}</b>ක් හමුවිය` : `සියලු ගීත: <b>${count ?? 0}</b>`;
  $("list").innerHTML = data.map(card).join("") || `<div class="empty">කිසිවක් හමු නොවීය. වෙනත් වචනයකින් උත්සාහ කරන්න.</div>`;
  $("pg").textContent = `පිටුව ${page+1} / ${pages}`;
  $("prev").disabled = page === 0; $("next").disabled = page + 1 >= pages;
  if(scroll) window.scrollTo({top:0, behavior:"smooth"});
}
const reload = () => { clearTimeout(timer); timer = setTimeout(() => { page = 0; load(); }, 300); };
$("q").addEventListener("input", reload); $("sc").onchange = reload; $("lg").onchange = reload;
$("prev").onclick = () => { if(page > 0){ page--; load(true); } };
$("next").onclick = () => { page++; load(true); };

async function init(){
  const {count} = await sb.from("songs").select("id", {count:"exact", head:true}).eq("is_hidden", false);
  $("stat").innerHTML = count != null ? `ගීත <b>${count}</b>ක් ඇතුළත්` : "";
  const {data} = await sb.from("songs").select("language").eq("is_hidden", false).not("language", "is", null).limit(1000);
  [...new Set((data || []).map(r => String(r.language).trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, "si"))
    .forEach(l => $("lg").insertAdjacentHTML("beforeend", `<option value="${esc(l)}">${esc(l)}</option>`));
}
load(); init();
</script>
</body>
</html>
