<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Song Lyrics Collection — Amila Udawattha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600&family=Anton&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#00153a;--card:#04204d;--tx:#e6f1fb;--mu:#7fa6c9;--ac:#1ea7e1;--ac2:#0b3a6e;--bd:#1f4a7a;--hl:rgba(255,214,10,.35);--onac:#00153a;--row:#1b8ed0;--rowbd:#2a4468}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Sinhala","Iskoola Pota",system-ui,sans-serif;line-height:1.6;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 60px}
header{text-align:center;padding:90px 0 0}
header .sub0{margin:0;color:#29b6f6;font-size:13px;letter-spacing:.5px;text-transform:uppercase;line-height:1.5}
h1{font:400 50px/1.1 "Anton","Impact","Arial Narrow",sans-serif;margin:6px 0 0;color:#fff;text-transform:uppercase;letter-spacing:1px}
.nav{text-align:center;margin:30px 0 0}
.pill{display:inline-block;padding:8px 16px;border:1px solid var(--ac);border-radius:999px;background:transparent;color:#5fc3f0;font:inherit;font-size:13.5px;line-height:1.4;text-decoration:none;cursor:pointer}
.pill:hover{background:rgba(30,167,225,.12)}
.search{margin-top:22px}
#q{display:block;width:100%;height:72px;padding:0 32px;font:inherit;font-size:18px;border:1px solid #000;border-radius:999px;background:#fff;color:#111;-webkit-appearance:none;appearance:none}
#q::-webkit-search-cancel-button{cursor:pointer}
.hint{text-align:center;color:#1b8ed0;font-size:13px;margin:14px 0 0}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px}
select{padding:7px 16px;font:inherit;font-size:13.5px;border:1px solid var(--ac);border-radius:999px;background:var(--bg);color:#5fc3f0;max-width:100%}
:is(#q,select,button,a):focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#info{font-size:13px;color:var(--mu);margin:34px 0 12px;text-align:center}
#info b{color:#5fc3f0}
.item{border:1px solid var(--rowbd);border-radius:20px;padding:14px 20px;margin-bottom:10px;color:var(--row)}
.item h2{font:700 15px/1.5 "Noto Sans Sinhala",sans-serif;margin:0;color:var(--row)}
.au{margin:2px 0 0;font-size:14px;color:var(--row)}
.meta{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:6px;font-size:12.5px;color:var(--mu)}
.meta b{color:#8fc9ec;font-weight:600}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{border:1px solid var(--rowbd);color:var(--row);border-radius:999px;padding:0 10px;font-size:12px}
.snip{margin:8px 0 0;padding:6px 12px;background:var(--ac2);color:var(--tx);border-radius:12px;font-size:13.5px}
.foot{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid var(--rowbd)}
.b{padding:3px 14px;border:1px solid var(--ac);border-radius:999px;background:transparent;color:#5fc3f0;font:inherit;font-size:13px;cursor:pointer}
.b:hover{background:rgba(30,167,225,.12)}
.b:disabled{opacity:.35;cursor:default}
a.lnk{color:#5fc3f0;word-break:break-all}
mark{background:var(--hl);color:inherit;border-radius:2px;padding:0 1px}
.pager{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:22px;font-size:13px;color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:30px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#e6f1fb;color:#00153a;padding:8px 16px;border-radius:20px;font-size:14px;z-index:99}
.hide{display:none!important}
#rd{border:0;border-radius:18px;padding:0;background:#fff;color:#2b2b2b;width:min(720px,94vw);max-height:90vh;box-shadow:0 20px 60px rgba(0,0,0,.55)}
#rd::backdrop{background:rgba(0,10,30,.75)}
#rd[open]{display:flex;flex-direction:column}
.rdh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 22px 12px;border-bottom:1px solid #e3e3e3}
.rdh h2{margin:0;font-size:1.25rem;line-height:1.5;color:#222}
.rdh .rm{color:#666;font-size:.85rem;margin-top:2px}
#rdx{flex:none;background:#f1f1f1;border:0;color:#333;width:34px;height:34px;padding:0;border-radius:50%;font-size:1.1rem;line-height:1;cursor:pointer}
#rdx:hover{background:#e0e0e0}
.rdb{overflow:auto;padding:16px 22px 24px;font:inherit;font-size:1.05rem;line-height:2;color:#2b2b2b;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.rdf{display:flex;justify-content:flex-end;gap:8px;padding:12px 22px;border-top:1px solid #e3e3e3}
.rbtn{padding:6px 18px;border:1px solid #1b6fa8;border-radius:999px;background:#1b6fa8;color:#fff;font:inherit;font-size:14px;cursor:pointer}
.rbtn:hover{background:#155a89}
.rbtn.g{background:transparent;color:#333;border-color:#bbb}
.rbtn.g:hover{background:#f1f1f1}
@media(max-width:520px){header{padding-top:56px}h1{font-size:40px}#q{height:60px}}
</style>
</head>
<body>
<div id="toast" class="hide"></div>
<dialog id="rd" aria-labelledby="rdt">
  <div class="rdh"><div><h2 id="rdt"></h2><div class="rm" id="rdm"></div></div><button type="button" id="rdx" aria-label="වසන්න">✕</button></div>
  <pre class="rdb" id="rdb"></pre>
  <div class="rdf"><button type="button" class="rbtn" id="rdc">Copy</button><button type="button" class="rbtn g" id="rdc2">වසන්න</button></div>
</dialog>
<div class="wrap">
<header><p class="sub0">Amila Udawattha</p><h1>Song Lyrics Collection</h1><p id="stat" class="hide"></p></header>
<div class="nav"><a class="pill" href="index.html">← Library</a></div>

<div class="search">
  <input id="q" type="search" autocomplete="off" aria-label="Search">
  <p class="hint">Search by Song Title | Artist | Lyricist | Composer | Film | Lyrics</p>
  <div class="row">
    <select id="sc" aria-label="සොයන ක්ෂේත්‍රය">
      <option value="all">සියලු ක්ෂේත්‍ර</option><option value="title">ගීතයේ නම</option><option value="artist">ගායකයා</option>
      <option value="lyricist">පද රචකයා</option><option value="composer">සංගීත අධ්‍යක්ෂ</option><option value="film">චිත්‍රපටය / ඇල්බමය</option><option value="lyrics">ගීත පද</option>
    </select>
    <select id="lg" aria-label="භාෂාව"><option value="">සියලු භාෂා</option></select>
  </div>
</div>

<div id="info"></div>
<div id="list"></div>
<div class="pager"><button class="b" id="prev">← පෙර</button><span id="pg"></span><button class="b" id="next">ඊළඟ →</button></div>
</div>

<script>
const sb = supabase.createClient("https://jcijglwpkfluyzrltimk.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjaWpnbHdwa2ZsdXl6cmx0aW1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4MzU3OTUsImV4cCI6MjA4MjQxMTc5NX0.dvT8OiyVEiYn_DhkMakmSq1Vvr4REDr0kYPnyqCtWHs");
const $ = id => document.getElementById(id);
const SIZE = 15;
const SCOPE = {all:["title","artist","lyricist","composer","album","film","genre","language","lyrics"], title:["title"], artist:["artist"], lyricist:["lyricist"],
  composer:["composer"], film:["film","album"], lyrics:["lyrics"]};
let page = 0, seq = 0, timer; const cache = {};

const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const terms = () => $("q").value.replace(/[,()%*_\\"']/g, " ").split(/\s+/).filter(Boolean);
const rx = t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function hl(s){
  let h = esc(s);
  terms().forEach(t => { h = h.replace(new RegExp("(" + rx(esc(t)) + ")(?![^<]*>)", "gi"), "<mark>$1</mark>"); });
  return h;
}
function linkOf(u){
  u = String(u ?? "").trim();
  const h = /^https?:\/\//i.test(u) ? u : /^www\./i.test(u) ? "https://" + u : "";
  return h ? `<a class="lnk" href="${esc(h)}" target="_blank" rel="noopener noreferrer">${esc(u.replace(/^https?:\/\//i, "").replace(/\/$/, ""))}</a>` : "";
}
function toast(t){ const e = $("toast"); e.textContent = t; e.classList.remove("hide"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.add("hide"), 2000); }
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); }
  toast("Copy කළා ✔");
}
function copySong(id){
  const b = cache[id];
  const head = [b.title, b.artist && "ගායනය: " + b.artist, b.lyricist && "පද රචනය: " + b.lyricist, b.composer && "සංගීතය: " + b.composer,
    b.film && "චිත්‍රපටය: " + b.film, b.album && "ඇල්බමය: " + b.album, b.year && "වර්ෂය: " + b.year, b.source_url && "මූලාශ්‍රය: " + b.source_url].filter(Boolean).join("\n");
  copyText(head + (b.lyrics ? "\n\n" + b.lyrics : ""));
}
let curId = null;
function openLyrics(id){
  const b = cache[id]; if(!b) return;
  curId = id;
  $("rdt").textContent = b.title || "";
  $("rdm").textContent = [b.artist, b.lyricist && "පද රචනය: " + b.lyricist, b.composer && "සංගීතය: " + b.composer].filter(Boolean).join(" · ");
  $("rdb").innerHTML = hl(b.lyrics || "");
  $("rd").showModal(); $("rdb").scrollTop = 0;
}
$("rdx").onclick = $("rdc2").onclick = () => $("rd").close();
$("rdc").onclick = () => { if(curId != null) copySong(curId); };
$("rd").addEventListener("click", e => { if(e.target === e.currentTarget) $("rd").close(); });
/* ගැළපෙන පද පේළි (සෙවුම් වචන පද තුළ ඇත්නම්) */
function snippet(b){
  const ts = terms().map(t => t.toLowerCase()); if(!ts.length || !b.lyrics) return "";
  const lines = b.lyrics.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  const hit = lines.filter(l => ts.some(t => l.toLowerCase().includes(t))).slice(0, 2);
  return hit.length ? `<div class="snip">${hit.map(hl).join("<br>")}</div>` : "";
}
function card(b){
  const subs = [b.language, b.genre].filter(Boolean);
  const meta = [b.lyricist && `පද රචනය: <b>${hl(b.lyricist)}</b>`, b.composer && `සංගීතය: <b>${hl(b.composer)}</b>`,
    b.film && `චිත්‍රපටය: <b>${hl(b.film)}</b>`, b.album && `ඇල්බමය: <b>${hl(b.album)}</b>`, b.year && `වර්ෂය: <b>${esc(b.year)}</b>`]
    .filter(Boolean).map(x => `<span>${x}</span>`).join("");
  return `<article class="item">
    <h2>${hl(b.title) || "(නම නැත)"}</h2>
    ${b.artist ? `<p class="au">${hl(b.artist)}</p>` : ""}
    ${meta ? `<div class="meta">${meta}</div>` : ""}
    ${subs.length ? `<div class="tags">${subs.map(s => `<span class="tag">${hl(s)}</span>`).join("")}</div>` : ""}
    ${snippet(b)}
        <div class="foot">${b.source_url ? `<span style="margin-right:auto;font-size:13px">🔗 ${linkOf(b.source_url) || esc(b.source_url)}</span>` : ""}${b.lyrics ? `<button class="b" onclick="openLyrics(${b.id})">ගීත පද බලන්න</button>` : ""}<button class="b" onclick="copySong(${b.id})">Copy</button></div>
  </article>`;
}
const filt = qb => {
  const cols = SCOPE[$("sc").value] || SCOPE.all;
  terms().forEach(t => { qb = qb.or(cols.map(c => `${c}.ilike.%${t}%`).join(",")); });
  if($("lg").value) qb = qb.eq("language", $("lg").value);
  return qb;
};
async function load(scroll){
  const my = ++seq;
  const {data, count, error} = await filt(sb.from("songs").select("*", {count:"exact"}).eq("is_hidden", false))
    .order("title").order("id").range(page*SIZE, page*SIZE + SIZE - 1);
  if(my !== seq) return;
  if(error){ $("info").textContent = "දෝෂයක්: " + error.message; return; }
  data.forEach(b => cache[b.id] = b);
  const pages = Math.max(1, Math.ceil((count || 0) / SIZE));
  $("info").innerHTML = (terms().length || $("lg").value) ? `ප්‍රතිඵල <b>${count ?? 0}</b>ක් හමුවිය` : `සියලු ගීත: <b>${count ?? 0}</b>`;
  $("list").innerHTML = data.map(card).join("") || `<div class="empty">කිසිවක් හමු නොවීය. වෙනත් වචනයකින් උත්සාහ කරන්න.</div>`;
  $("pg").textContent = `පිටුව ${page+1} / ${pages}`;
  $("prev").disabled = page === 0; $("next").disabled = page + 1 >= pages;
  if(scroll) window.scrollTo({top:0, behavior:"smooth"});
}
const reload = () => { clearTimeout(timer); timer = setTimeout(() => { page = 0; load(); }, 300); };
$("q").addEventListener("input", reload); $("sc").onchange = reload; $("lg").onchange = reload;
$("prev").onclick = () => { if(page > 0){ page--; load(true); } };
$("next").onclick = () => { page++; load(true); };

async function init(){
  const {count} = await sb.from("songs").select("id", {count:"exact", head:true}).eq("is_hidden", false);
  $("stat").innerHTML = count != null ? `ගීත <b>${count}</b>ක් ඇතුළත්` : "";
  const {data} = await sb.from("songs").select("language").eq("is_hidden", false).not("language", "is", null).limit(1000);
  [...new Set((data || []).map(r => String(r.language).trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, "si"))
    .forEach(l => $("lg").insertAdjacentHTML("beforeend", `<option value="${esc(l)}">${esc(l)}</option>`));
}
load(); init();
</script>
</body>
</html>
